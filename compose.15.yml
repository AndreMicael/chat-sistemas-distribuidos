# Bancada de instâncias em cluster para a integração da Pessoa 02 e testes da Pessoa 04.
# docker compose -p sd15 -f compose.15.yml up --build --scale chat=15 -d
services:
  chat:
    build: .
    ports:
      - "127.0.0.1::4000"
    environment:
      BIND_IP: "0.0.0.0"
      PORT: "4000"
      COOKIE: "chat_sd_cookie"
      ERL_FLAGS: "+S 2:2 -setcookie chat_sd_cookie"
    healthcheck:
      test: ["CMD", "elixir", "--erl", "+S 1:1", "-e", "Application.ensure_all_started(:inets); case :httpc.request(~c\"http://127.0.0.1:4000/health\") do {:ok, {{_, 200, _}, _, _}} -> System.halt(0); _ -> System.halt(1) end"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 45s
